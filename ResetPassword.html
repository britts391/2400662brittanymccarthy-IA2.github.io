<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
     <!-- External icon stylesheet from Font Awesome for button icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />

    <!-- External CSS file that styles the register page -->
    <link rel="stylesheet" type="text/css" href="../Stylesheet/resetPassword.css" />
</head>

<body>
    <div class = "logo">
    <img src="../Assets/Logo.png" class="logo" alt="Image not found" height="100" width="100" align="left" />
    </div>
    <div class="container">
        <h2>Reset Password</h2>

        <!-- TRN Input -->
        <label for="trn">Enter Your TRN (XXX-XXX-XXX)</label>
        <input type="text" id="trn" placeholder="123-456-789" maxlength="11">


        <!-- New Password Field -->
        <input type="password" id="newPass" placeholder="Enter new password" />
        
        <!-- Confirm Password Field -->
        <input type="password" id="confirmPass" placeholder="Confirm new password" />
        
        <!-- TRN Message -->
        <p id="trnMsg" class="msg"></p> <!-- For immediate TRN feedback -->
        <!-- Button -->
        <button onclick="resetPassword()">Reset Password</button>

        <p id="message" class="msg"></p>

        <a href="SignIn.html">Back to Login</a>
    </div>
    <!-- Footer Section -->
    <footer class="footer">
        <p>&copy; 2025 Slay by Britts</p>
    </footer>
    <!-- Britts.js may contain shared site-wide functionality (e.g., togglePassword) -->
    <script src="../Javascript/Britts.js"></script>
    <script src="../Javascript/resetPassword.js"></script>
</body>
</html>
